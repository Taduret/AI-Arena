<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Arena — Claude vs Gemini vs DeepSeek</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050810">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Arena">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --panel: #0a0f1e;
    --border: #1a2540;
    --claude: #ff6b35;
    --gemini: #4285f4;
    --deepseek: #00d4aa;
    --text: #e0e8ff;
    --muted: #4a5580;
    --glow-claude: 0 0 20px rgba(255,107,53,0.4);
    --glow-gemini: 0 0 20px rgba(66,133,244,0.4);
    --glow-deepseek: 0 0 20px rgba(0,212,170,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(26,37,64,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,37,64,0.4) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeDown 0.8s ease;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: clamp(24px, 5vw, 48px);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--claude), var(--gemini), var(--deepseek));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .tagline {
    font-family: 'Share Tech Mono', monospace;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* API Keys Section */
  .keys-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    animation: fadeUp 0.8s ease 0.2s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .keys-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .keys-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
  }

  .key-input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .key-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .key-label.claude { color: var(--claude); }
  .key-label.gemini { color: var(--gemini); }
  .key-label.deepseek { color: var(--deepseek); }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .claude .dot { background: var(--claude); box-shadow: 0 0 6px var(--claude); }
  .gemini .dot { background: var(--gemini); box-shadow: 0 0 6px var(--gemini); }
  .deepseek .dot { background: var(--deepseek); box-shadow: 0 0 6px var(--deepseek); }

  .key-input {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    width: 100%;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .key-input:focus { outline: none; }
  .key-input.claude:focus { border-color: var(--claude); box-shadow: var(--glow-claude); }
  .key-input.gemini:focus { border-color: var(--gemini); box-shadow: var(--glow-gemini); }
  .key-input.deepseek:focus { border-color: var(--deepseek); box-shadow: var(--glow-deepseek); }

  /* Prompt Section */
  .prompt-section {
    animation: fadeUp 0.8s ease 0.4s both;
    margin-bottom: 24px;
  }

  .prompt-wrapper {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .prompt-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .prompt-textarea {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    resize: vertical;
    min-height: 100px;
    transition: border-color 0.2s;
    margin-bottom: 14px;
  }

  .prompt-textarea:focus {
    outline: none;
    border-color: rgba(255,255,255,0.2);
  }

  .launch-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--claude), var(--gemini), var(--deepseek));
    border: none;
    border-radius: 8px;
    color: white;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    text-transform: uppercase;
  }

  .launch-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .launch-btn:active { transform: translateY(0); }
  .launch-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Results */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
    animation: fadeUp 0.8s ease 0.6s both;
  }

  .result-card {
    background: var(--panel);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .result-card.active.claude { border-color: var(--claude); box-shadow: var(--glow-claude); }
  .result-card.active.gemini { border-color: var(--gemini); box-shadow: var(--glow-gemini); }
  .result-card.active.deepseek { border-color: var(--deepseek); box-shadow: var(--glow-deepseek); }

  .card-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }

  .card-header.claude { background: rgba(255,107,53,0.08); }
  .card-header.gemini { background: rgba(66,133,244,0.08); }
  .card-header.deepseek { background: rgba(0,212,170,0.08); }

  .ai-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .claude .ai-icon { background: rgba(255,107,53,0.2); }
  .gemini .ai-icon { background: rgba(66,133,244,0.2); }
  .deepseek .ai-icon { background: rgba(0,212,170,0.2); }

  .ai-name {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
  }

  .claude .ai-name { color: var(--claude); }
  .gemini .ai-name { color: var(--gemini); }
  .deepseek .ai-name { color: var(--deepseek); }

  .status-badge {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  .status-idle { background: rgba(74,85,128,0.3); color: var(--muted); }
  .status-loading { background: rgba(255,200,0,0.15); color: #ffc800; animation: pulse 1s infinite; }
  .status-done.claude { background: rgba(255,107,53,0.2); color: var(--claude); }
  .status-done.gemini { background: rgba(66,133,244,0.2); color: var(--gemini); }
  .status-done.deepseek { background: rgba(0,212,170,0.2); color: var(--deepseek); }
  .status-error { background: rgba(255,80,80,0.2); color: #ff5050; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .card-body {
    padding: 18px;
    min-height: 200px;
  }

  .response-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .placeholder-text {
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
    padding-top: 60px;
  }

  .loading-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding-top: 80px;
  }

  .loading-dots span {
    width: 8px; height: 8px;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .claude .loading-dots span { background: var(--claude); }
  .gemini .loading-dots span { background: var(--gemini); }
  .deepseek .loading-dots span { background: var(--deepseek); }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .card-footer {
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .response-time {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .token-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* No key notice */
  .no-key-notice {
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    text-align: center;
    padding-top: 70px;
    letter-spacing: 1px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">AI ARENA</div>
    <div class="tagline">Claude · Gemini · DeepSeek — одновременно</div>
  </header>

  <div class="keys-section">
    <div class="keys-title">// API ключи</div>
    <div class="keys-grid">
      <div class="key-input-group">
        <div class="key-label claude"><span class="dot"></span> CLAUDE (Anthropic)</div>
        <input type="password" class="key-input claude" id="key-claude" placeholder="sk-ant-..." autocomplete="off">
      </div>
      <div class="key-input-group">
        <div class="key-label gemini"><span class="dot"></span> GEMINI (Google)</div>
        <input type="password" class="key-input gemini" id="key-gemini" placeholder="AIza..." autocomplete="off">
      </div>
      <div class="key-input-group">
        <div class="key-label deepseek"><span class="dot"></span> DEEPSEEK</div>
        <input type="password" class="key-input deepseek" id="key-deepseek" placeholder="sk-..." autocomplete="off">
      </div>
    </div>
  </div>

  <div class="prompt-section">
    <div class="prompt-wrapper">
      <div class="prompt-label">// Вопрос для всех трёх</div>
      <textarea class="prompt-textarea" id="prompt" placeholder="Задай любой вопрос — все три ИИ ответят одновременно..."></textarea>
      <button class="launch-btn" id="launch-btn" onclick="launchAll()">⚡ ЗАПУСТИТЬ АРЕНУ</button>
    </div>
  </div>

  <div class="results-grid">
    <!-- Claude -->
    <div class="result-card claude" id="card-claude">
      <div class="card-header claude">
        <div class="ai-icon">🤖</div>
        <div class="ai-name">CLAUDE</div>
        <div class="status-badge status-idle" id="status-claude">IDLE</div>
      </div>
      <div class="card-body" id="body-claude">
        <div class="no-key-notice" id="placeholder-claude">Введи API ключ выше</div>
      </div>
      <div class="card-footer">
        <div class="response-time" id="time-claude">—</div>
        <div class="token-count" id="tokens-claude">—</div>
      </div>
    </div>

    <!-- Gemini -->
    <div class="result-card gemini" id="card-gemini">
      <div class="card-header gemini">
        <div class="ai-icon">✨</div>
        <div class="ai-name">GEMINI</div>
        <div class="status-badge status-idle" id="status-gemini">IDLE</div>
      </div>
      <div class="card-body" id="body-gemini">
        <div class="no-key-notice" id="placeholder-gemini">Введи API ключ выше</div>
      </div>
      <div class="card-footer">
        <div class="response-time" id="time-gemini">—</div>
        <div class="token-count" id="tokens-gemini">—</div>
      </div>
    </div>

    <!-- DeepSeek -->
    <div class="result-card deepseek" id="card-deepseek">
      <div class="card-header deepseek">
        <div class="ai-icon">🌊</div>
        <div class="ai-name">DEEPSEEK</div>
        <div class="status-badge status-idle" id="status-deepseek">IDLE</div>
      </div>
      <div class="card-body" id="body-deepseek">
        <div class="no-key-notice" id="placeholder-deepseek">Введи API ключ выше</div>
      </div>
      <div class="card-footer">
        <div class="response-time" id="time-deepseek">—</div>
        <div class="token-count" id="tokens-deepseek">—</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Load saved keys on startup
  window.addEventListener('DOMContentLoaded', () => {
    ['claude', 'gemini', 'deepseek'].forEach(ai => {
      const saved = localStorage.getItem(`arena-key-${ai}`);
      if (saved) {
        document.getElementById(`key-${ai}`).value = saved;
      }
    });
    updatePlaceholders();
  });

  // Save keys on input
  document.getElementById('key-claude').addEventListener('input', () => { saveKey('claude'); updatePlaceholders(); });
  document.getElementById('key-gemini').addEventListener('input', () => { saveKey('gemini'); updatePlaceholders(); });
  document.getElementById('key-deepseek').addEventListener('input', () => { saveKey('deepseek'); updatePlaceholders(); });

  function saveKey(ai) {
    const val = document.getElementById(`key-${ai}`).value.trim();
    if (val) localStorage.setItem(`arena-key-${ai}`, val);
    else localStorage.removeItem(`arena-key-${ai}`);
  }

  function updatePlaceholders() {
    const ais = ['claude', 'gemini', 'deepseek'];
    ais.forEach(ai => {
      const key = document.getElementById(`key-${ai}`).value.trim();
      const ph = document.getElementById(`placeholder-${ai}`);
      if (ph) ph.textContent = key ? 'Готов к запуску...' : 'Введи API ключ выше';
    });
  }

  function setLoading(ai) {
    const card = document.getElementById(`card-${ai}`);
    card.classList.add('active');
    document.getElementById(`status-${ai}`).className = 'status-badge status-loading';
    document.getElementById(`status-${ai}`).textContent = 'ДУМАЕТ';
    document.getElementById(`body-${ai}`).innerHTML = `
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>`;
    document.getElementById(`time-${ai}`).textContent = '—';
    document.getElementById(`tokens-${ai}`).textContent = '—';
  }

  function setResult(ai, text, time, tokens) {
    const statusEl = document.getElementById(`status-${ai}`);
    statusEl.className = `status-badge status-done ${ai}`;
    statusEl.textContent = 'ГОТОВО';
    document.getElementById(`body-${ai}`).innerHTML = `<div class="response-text">${escapeHtml(text)}</div>`;
    document.getElementById(`time-${ai}`).textContent = `${time}ms`;
    document.getElementById(`tokens-${ai}`).textContent = tokens ? `~${tokens} токенов` : '';
  }

  function setError(ai, msg) {
    const statusEl = document.getElementById(`status-${ai}`);
    statusEl.className = 'status-badge status-error';
    statusEl.textContent = 'ОШИБКА';
    document.getElementById(`body-${ai}`).innerHTML = `<div class="response-text" style="color:#ff5050;">${escapeHtml(msg)}</div>`;
    document.getElementById(`card-${ai}`).classList.remove('active');
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function askClaude(key, prompt) {
    const start = Date.now();
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1024,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Ошибка API');
    const time = Date.now() - start;
    const text = data.content?.[0]?.text || '(нет ответа)';
    const tokens = data.usage?.output_tokens;
    return { text, time, tokens };
  }

  async function askGemini(key, prompt) {
    const start = Date.now();
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Ошибка API');
    const time = Date.now() - start;
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '(нет ответа)';
    const tokens = data.usageMetadata?.candidatesTokenCount;
    return { text, time, tokens };
  }

  async function askDeepSeek(key, prompt) {
    const start = Date.now();
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [{ role: 'user', content: prompt }],
        max_tokens: 1024
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'Ошибка API');
    const time = Date.now() - start;
    const text = data.choices?.[0]?.message?.content || '(нет ответа)';
    const tokens = data.usage?.completion_tokens;
    return { text, time, tokens };
  }

  async function launchAll() {
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) { alert('Введи вопрос!'); return; }

    const keyC = document.getElementById('key-claude').value.trim();
    const keyG = document.getElementById('key-gemini').value.trim();
    const keyD = document.getElementById('key-deepseek').value.trim();

    if (!keyC && !keyG && !keyD) {
      alert('Введи хотя бы один API ключ!');
      return;
    }

    document.getElementById('launch-btn').disabled = true;

    const tasks = [];

    if (keyC) {
      setLoading('claude');
      tasks.push(askClaude(keyC, prompt)
        .then(r => setResult('claude', r.text, r.time, r.tokens))
        .catch(e => setError('claude', e.message)));
    }

    if (keyG) {
      setLoading('gemini');
      tasks.push(askGemini(keyG, prompt)
        .then(r => setResult('gemini', r.text, r.time, r.tokens))
        .catch(e => setError('gemini', e.message)));
    }

    if (keyD) {
      setLoading('deepseek');
      tasks.push(askDeepSeek(keyD, prompt)
        .then(r => setResult('deepseek', r.text, r.time, r.tokens))
        .catch(e => setError('deepseek', e.message)));
    }

    await Promise.all(tasks);
    document.getElementById('launch-btn').disabled = false;
  }

  // Register service worker for PWA
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  // Enter to submit
  document.getElementById('prompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.ctrlKey) launchAll();
  });
</script>
</body>
</html>
